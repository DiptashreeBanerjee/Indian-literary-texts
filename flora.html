    // ---------- TABS ----------
    const kind = "flora";   // "flora" or "fauna"

    const TABS = [
      { label: "View all the five novels", suffix: "" },
      { label: "Cities and Canopies",      suffix: "1" },
      { label: "Indica",                   suffix: "2" },
      { label: "Rain in the Mountains",    suffix: "3" },
      { label: "Sacred Plants of India",   suffix: "4" },
      { label: "The Fall of a Sparrow",    suffix: "5" }
    ];

    const tabsEl  = document.getElementById("tabs");
    const panelEl = document.getElementById("panel");
    const sortEl  = document.getElementById("sort");

    let current = { title: "", items: [] };   // the tab currently open

    TABS.forEach(function (tab, i) {
      const key = kind + tab.suffix;          // e.g. "flora3"
      const btn = document.createElement("button");
      btn.textContent = tab.label;
      btn.onclick = function () {
        document.querySelectorAll(".tabs button").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        current = { title: tab.label, items: data[key] };
        render();
      };
      tabsEl.appendChild(btn);
      if (i === 0) btn.click();               // open first tab by default
    });

    sortEl.onchange = render;                 // re-draw when the sort changes

    function render() {
      const items = current.items.slice();    // copy, so the original order is kept

      if (sortEl.value === "az") {
        items.sort(function (a, b) {
          return a.localeCompare(b, undefined, { sensitivity: "base" });
        });
      } else if (sortEl.value === "za") {
        items.sort(function (a, b) {
          return b.localeCompare(a, undefined, { sensitivity: "base" });
        });
      }

      panelEl.innerHTML = "";
      const h = document.createElement("h2");
      h.textContent = current.title;
      const p = document.createElement("p");
      p.className = "count";
      p.textContent = items.length + " entries";
      const ul = document.createElement("ul");
      items.forEach(function (name) {
        const li = document.createElement("li");
        li.textContent = name;
        ul.appendChild(li);
      });
      panelEl.appendChild(h);
      panelEl.appendChild(p);
      panelEl.appendChild(ul);
    }
